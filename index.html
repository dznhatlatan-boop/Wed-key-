<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TÂN HUB // KEY SYSTEM</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #0f172a; color: #f8fafc; padding: 16px;
    }
    .box {
      width: 100%; max-width: 390px; background: #1e293b; border: 1px solid #334155;
      border-radius: 14px; padding: 22px; text-align: center;
    }
    h1 { margin: 0 0 8px; font-size: 20px; color: #38bdf8; }
    p { margin: 0 0 16px; font-size: 13px; color: #cbd5e1; }
    .key-box {
      background: #0f172a; border: 1px dashed #64748b; border-radius: 10px;
      padding: 14px; font-size: 20px; font-weight: bold; letter-spacing: 1.5px;
      color: #4ade80; margin-bottom: 16px; word-break: break-all;
    }
    button {
      width: 100%; padding: 12px; border: none; border-radius: 10px;
      font-size: 15px; font-weight: bold; cursor: pointer; margin-bottom: 10px;
    }
    .btn-get { background: #2563eb; color: #fff; }
    .btn-copy { background: #16a34a; color: #fff; }
    .msg { font-size: 12px; color: #94a3b8; min-height: 18px; }
  </style>
</head>
<body>
  <div class="box">
    <h1>TÂN HUB // KEY SYSTEM</h1>
    <p>Mỗi lần bấm tạo một mã key mới khác nhau.</p>
    <div id="keyOut" class="key-box">----------</div>
    <button class="btn-get" onclick="taoKeyMoi()">Lấy Key Mới</button>
    <button class="btn-copy" onclick="copyKey()">Sao Chép Key</button>
    <div id="msg" class="msg"></div>
  </div>

  <script>
    const HE_SO = 3;
    const CONG_THEM = 17;
    const CHIA_LAY_DU = 97;

    function taoKeyMoi() {
      const goc = Math.floor(10000000 + Math.random() * 89999999);
      const maCheck = ((goc * HE_SO + CONG_THEM) % CHIA_LAY_DU);
      const duoi = String(maCheck).padStart(2, "0");
      const keyFull = `${goc}${duoi}`;
      document.getElementById("keyOut").textContent = keyFull;
      document.getElementById("msg").textContent = "Đã tạo key mới!";
    }

    function copyKey() {
      const k = document.getElementById("keyOut").textContent;
      if (!k || k === "----------") {
        document.getElementById("msg").textContent = "Bấm Lấy Key Mới trước đã!";
        return;
      }
      navigator.clipboard.writeText(k).then(() => {
        document.getElementById("msg").textContent = "Đã sao chép key!";
      }).catch(() => {
        document.getElementById("msg").textContent = "Giữ lì vào dãy số để sao chép.";
      });
    }

    taoKeyMoi();
  </script>
</body>
</html>
