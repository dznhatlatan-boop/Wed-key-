<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TÂN HUB // KEY SYSTEM</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #1d2b64, #090d16 70%);
      color: #f8fafc;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 395px;
      background: linear-gradient(160deg, #1b263b, #111827);
      border: 2px solid #38bdf8;
      border-radius: 18px;
      padding: 24px 20px;
      text-align: center;
      box-shadow: 0 16px 40px rgba(0, 195, 255, 0.25);
    }

    h1 {
      margin: 0 0 6px;
      font-size: 21px;
      font-weight: 800;
      background: linear-gradient(90deg, #38bdf8, #facc15, #4ade80);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 0.6px;
    }

    p {
      margin: 0 0 16px;
      font-size: 12px;
      color: #bae6fd;
      line-height: 1.4;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1.5px solid #38bdf8;
      background: #091120;
      color: #fef08a;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 12px;
      text-align: center;
      outline: none;
    }

    .info-bar {
      background: #091120;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 11px 12px;
      font-size: 12px;
      color: #7dd3fc;
      margin-bottom: 12px;
      line-height: 1.6;
    }

    .key-box {
      background: #091120;
      border: 2px dashed #4ade80;
      border-radius: 12px;
      padding: 15px 12px;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #4ade80;
      margin-bottom: 14px;
      word-break: break-all;
    }

    button {
      width: 100%;
      padding: 12px 14px;
      border: none;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      margin-bottom: 10px;
    }

    .btn-get {
      background: linear-gradient(90deg, #2563eb, #06b6d4);
      color: #ffffff;
    }

    .btn-renew {
      background: linear-gradient(90deg, #f59e0b, #f97316);
      color: #1e1204;
    }

    .btn-renew:disabled {
      background: #475569;
      color: #cbd5e1;
      cursor: not-allowed;
    }

    .btn-copy {
      background: linear-gradient(90deg, #16a34a, #22c55e);
      color: #ffffff;
      margin-bottom: 6px;
    }

    .msg {
      font-size: 12px;
      color: #fde047;
      min-height: 18px;
      margin-top: 6px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>⚡ AK HUB // KEY SYSTEM ✨</h1>
    <p>🔑 Key theo UserId • ⏳ Chu kỳ 5h • 🚀 Đếm ngay khi lấy</p>

    <input id="uidInput" type="text" placeholder="🆔 Nhập UserId Roblox (VD: 123456789)" />

    <div class="info-bar">
      <div>🔄 Chu kỳ: <strong id="cycleLabel">Chưa lấy</strong></div>
      <div>⏱️ Thời gian còn lại: <strong id="keyCountdown">--:--:--</strong></div>
    </div>

    <div id="keyOut" class="key-box">----------</div>

    <button class="btn-get" onclick="getKeyNow()">⚡ Lấy Key Ngay</button>
    <button id="renewBtn" class="btn-renew" onclick="renewKey30s()">🔥 Gia Hạn Thêm 5h (30s)</button>
    <button class="btn-copy" onclick="copyKey()">📋 Sao Chép Key</button>

    <div id="msg" class="msg"></div>
  </div>

  <script>
    const SECRET_SALT = 7919;
    const KEY_TTL_MS = 5 * 60 * 60 * 1000;
    const CYCLE_BUCKET_MS = 5 * 60 * 60 * 1000;
    const RENEW_WAIT_SEC = 30;
    const OWNER_ACCOUNTS = ["hupbera23", "qwp1545"];

    let hasTakenKey = false;
    let isOwnerMode = false;
    let expireAtMs = 0;
    let currentCycleIdx = null;
    let renewInterval = null;

    function getRawInput() {
      return document.getElementById("uidInput").value.trim();
    }

    function getCleanUid() {
      return getRawInput().replace(/\D/g, "");
    }

    function isOwnerInput(raw) {
      return OWNER_ACCOUNTS.includes(String(raw || "").toLowerCase());
    }

    function getCycleFromTimestamp(ms) {
      return Math.floor(ms / CYCLE_BUCKET_MS);
    }

    function calcKey(uid, cycleIdx) {
      let hash = SECRET_SALT;
      const mix = `${uid}_${cycleIdx}`;
      for (let i = 0; i < mix.length; i++) {
        hash = (hash * 131 + mix.charCodeAt(i)) % 89999999;
      }
      return String(10000000 + hash);
    }

    function formatHMS(ms) {
      const totalSec = Math.max(0, Math.floor(ms / 1000));
      const h = String(Math.floor(totalSec / 3600)).padStart(2, "0");
      const m = String(Math.floor((totalSec % 3600) / 60)).padStart(2, "0");
      const s = String(totalSec % 60).padStart(2, "0");
      return `${h}:${m}:${s}`;
    }

    function resetKeyState() {
      hasTakenKey = false;
      isOwnerMode = false;
      expireAtMs = 0;
      currentCycleIdx = null;
      document.getElementById("cycleLabel").textContent = "Chưa lấy";
      document.getElementById("keyOut").textContent = "----------";
      document.getElementById("keyCountdown").textContent = "--:--:--";
    }

    function applyOwnerState(raw) {
      hasTakenKey = false;
      isOwnerMode = true;
      expireAtMs = 0;
      currentCycleIdx = "OWNER";
      document.getElementById("cycleLabel").textContent = "👑 OWNER VN";
      document.getElementById("keyCountdown").textContent = "♾️ VÔ HẠN";
      document.getElementById("keyOut").textContent = "OWNER-UNLIMITED";
      document.getElementById("msg").textContent = `👑 OWNER VN (${raw}) — Mở khóa vô hạn trong game!`;
    }

    function getKeyNow() {
      const raw = getRawInput();
      if (!raw) {
        document.getElementById("msg").textContent = "⚠️ Nhập UserId Roblox trước đã!";
        return;
      }

      if (isOwnerInput(raw)) {
        applyOwnerState(raw);
        return;
      }

      const uid = getCleanUid();
      if (!uid) {
        document.getElementById("msg").textContent = "❌ UserId chỉ gồm chữ số (VD: 123456789)!";
        return;
      }

      isOwnerMode = false;
      const now = Date.now();
      currentCycleIdx = getCycleFromTimestamp(now);
      expireAtMs = now + KEY_TTL_MS;
      hasTakenKey = true;

      const key = calcKey(uid, currentCycleIdx);
      document.getElementById("cycleLabel").textContent = "#" + currentCycleIdx;
      document.getElementById("keyOut").textContent = key;
      document.getElementById("keyCountdown").textContent = formatHMS(expireAtMs - Date.now());
      document.getElementById("msg").textContent = "✅ Đã tạo key! Có hiệu lực 5 giờ.";
    }

    function renewKey30s() {
      const raw = getRawInput();
      if (!raw) {
        document.getElementById("msg").textContent = "⚠️ Nhập UserId trước khi gia hạn!";
        return;
      }

      if (isOwnerInput(raw) || isOwnerMode) {
        applyOwnerState(raw);
        return;
      }

      const uid = getCleanUid();
      if (!uid) {
        document.getElementById("msg").textContent = "❌ UserId không hợp lệ!";
        return;
      }

      if (!hasTakenKey || !expireAtMs) {
        document.getElementById("msg").textContent = "⚠️ Bấm Lấy Key trước rồi mới gia hạn!";
        return;
      }

      if (renewInterval) return;

      let secLeft = RENEW_WAIT_SEC;
      const btn = document.getElementById("renewBtn");
      btn.disabled = true;
      btn.textContent = `⏳ Đang gia hạn: ${secLeft}s...`;
      document.getElementById("msg").textContent = `⏳ Đợi ${RENEW_WAIT_SEC}s để cộng thêm 5 giờ...`;

      renewInterval = setInterval(() => {
        secLeft--;
        if (secLeft > 0) {
          btn.textContent = `⏳ Đang gia hạn: ${secLeft}s...`;
        } else {
          clearInterval(renewInterval);
          renewInterval = null;
          btn.disabled = false;
          btn.textContent = `🔥 Gia Hạn Thêm 5h (${RENEW_WAIT_SEC}s)`;

          const baseTime = Math.max(Date.now(), expireAtMs);
          currentCycleIdx = currentCycleIdx + 1;
          expireAtMs = baseTime + KEY_TTL_MS;
          hasTakenKey = true;

          const newKey = calcKey(uid, currentCycleIdx);
          document.getElementById("cycleLabel").textContent = "#" + currentCycleIdx;
          document.getElementById("keyOut").textContent = newKey;
          document.getElementById("msg").textContent = "🎉 Gia hạn xong! Đã cộng thêm 5 giờ.";
        }
      }, 1000);
    }

    function copyKey() {
      const k = document.getElementById("keyOut").textContent;
      if (!hasTakenKey || !k || k === "----------" || k === "OWNER-UNLIMITED") {
        document.getElementById("msg").textContent = "⚠️ Lấy key theo UserId trước đã!";
        return;
      }

      navigator.clipboard.writeText(k).then(() => {
        document.getElementById("msg").textContent = "✅ Đã sao chép key!";
      }).catch(() => {
        document.getElementById("msg").textContent = "📋 Giữ lì vào key để sao chép.";
      });
    }

    document.getElementById("uidInput").addEventListener("input", () => {
      const raw = getRawInput();
      if (isOwnerInput(raw)) {
        applyOwnerState(raw);
        return;
      }
      resetKeyState();
      document.getElementById("msg").textContent = "💡 Bấm Lấy Key để bắt đầu đếm thời gian.";
    });

    setInterval(() => {
      const el = document.getElementById("keyCountdown");
      if (isOwnerMode) {
        el.textContent = "♾️ VÔ HẠN";
        return;
      }
      if (!hasTakenKey || !expireAtMs) {
        el.textContent = "--:--:--";
        return;
      }
      const left = expireAtMs - Date.now();
      if (left > 0) {
        el.textContent = formatHMS(left);
      } else {
        el.textContent = "00:00:00";
        document.getElementById("msg").textContent = "⏰ Hết thời gian key! Bấm Lấy Key hoặc Gia Hạn.";
      }
    }, 1000);
  </script>
</body>
</html>
