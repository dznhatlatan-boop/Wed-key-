<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TÂN HUB // KEY SYSTEM</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #0f172a; color: #f8fafc; padding: 16px;
    }
    .box {
      width: 100%; max-width: 400px; background: #1e293b; border: 1px solid #334155;
      border-radius: 14px; padding: 22px; text-align: center;
    }
    h1 { margin: 0 0 6px; font-size: 20px; color: #38bdf8; }
    p { margin: 0 0 14px; font-size: 13px; color: #cbd5e1; }
    input {
      width: 100%; padding: 11px; border-radius: 10px; border: 1px solid #475569;
      background: #0f172a; color: #fff; font-size: 14px; margin-bottom: 12px; text-align: center;
    }
    .info-bar {
      background: #0f172a; border: 1px solid #334155; border-radius: 10px;
      padding: 10px; font-size: 12px; color: #93c5fd; margin-bottom: 12px;
      line-height: 1.5;
    }
    .key-box {
      background: #0f172a; border: 1px dashed #64748b; border-radius: 10px;
      padding: 14px; font-size: 20px; font-weight: bold; letter-spacing: 1.5px;
      color: #4ade80; margin-bottom: 14px; word-break: break-all;
    }
    button {
      width: 100%; padding: 12px; border: none; border-radius: 10px;
      font-size: 14px; font-weight: bold; cursor: pointer; margin-bottom: 10px;
    }
    .btn-get { background: #2563eb; color: #fff; }
    .btn-renew { background: #d89006; color: #fff; }
    .btn-renew:disabled { background: #475569; color: #cbd5e1; cursor: not-allowed; }
    .btn-copy { background: #16a34a; color: #fff; }
    .msg { font-size: 12px; color: #94a3b8; min-height: 18px; }
  </style>
</head>
<body>
  <div class="box">
    <h1>ak hud // KEY SYSTEM</h1>
    <p>Key riêng theo UserId • Bắt đầu đếm khi bấm Lấy Key</p>

    <input id="uidInput" type="text" placeholder="Nhập UserId Roblox (VD: vd hupbera23)" />

    <div class="info-bar">
      <div>Chu kỳ key: <strong id="cycleLabel">Chưa lấy</strong></div>
      <div>Thời gian còn lại: <strong id="keyCountdown">--:--:--</strong></div>
    </div>

    <div id="keyOut" class="key-box">vd 23456789-</div>

    <button class="btn-get" onclick="layKeyMoiTuLucNay()">Lấy Key (Bắt Đầu Đếm)</button>
    <button id="renewBtn" class="btn-renew" onclick="giaHan30s()">Gia Hạn (Đếm Ngược 30s)</button>
    <button class="btn-copy" onclick="copyKey()">Sao Chép Key</button>

    <div id="msg" class="msg"></div>
  </div>

  <script>
    const SECRET_SALT = 7919; // Khớp _SecretSalt trong trai.lua
    const KEY_TTL_MS = 5 * 60 * 60 * 1000;
    const CYCLE_BUCKET_MS = 5 * 60 * 60 * 1000;

    let hasTakenKey = false; // Chỉ bật true sau khi bấm nút Lấy Key
    let expireAtMs = 0;
    let currentCycleIdx = null;
    let renewInterval = null;

    function getCleanUid() {
      return document.getElementById("uidInput").value.trim().replace(/\D/g, "");
    }

    function getCycleFromTimestamp(ms) {
      return Math.floor(ms / CYCLE_BUCKET_MS);
    }

    function tinhKey(uid, cycleIdx) {
      let hash = SECRET_SALT;
      const mix = `${uid}_${cycleIdx}`;
      for (let i = 0; i < mix.length; i++) {
        hash = (hash * 131 + mix.charCodeAt(i)) % 89999999;
      }
      return String(10000000 + hash);
    }

    function formatHMS(ms) {
      const totalSec = Math.max(0, Math.floor(ms / 1000));
      const h = String(Math.floor(totalSec / 3600)).padStart(2, "0");
      const m = String(Math.floor((totalSec % 3600) / 60)).padStart(2, "0");
      const s = String(totalSec % 60).padStart(2, "0");
      return `${h}:${m}:${s}`;
    }

    function resetTrangThaiChuaLayKey() {
      hasTakenKey = false;
      expireAtMs = 0;
      currentCycleIdx = null;
      document.getElementById("cycleLabel").textContent = "Chưa lấy";
      document.getElementById("keyOut").textContent = "----------";
      document.getElementById("keyCountdown").textContent = "--:--:--";
    }

    function layKeyMoiTuLucNay() {
      const uid = getCleanUid();
      if (!uid) {
        document.getElementById("msg").textContent = "Hãy nhập đúng UserId Roblox trước!";
        return;
      }

      const now = Date.now();
      currentCycleIdx = getCycleFromTimestamp(now);
      expireAtMs = now + KEY_TTL_MS;
      hasTakenKey = true;

      const key = tinhKey(uid, currentCycleIdx);
      document.getElementById("cycleLabel").textContent = "#" + currentCycleIdx;
      document.getElementById("keyOut").textContent = key;
      document.getElementById("keyCountdown").textContent = formatHMS(expireAtMs - Date.now());
      document.getElementById("msg").textContent = "Đã lấy key! Bắt đầu đếm ngược từ bây giờ.";
    }

    function giaHan60s() {
      const uid = getCleanUid();
      if (!uid) {
        document.getElementById("msg").textContent = "Nhập UserId trước khi bấm gia hạn!";
        return;
      }
      if (!hasTakenKey || !expireAtMs) {
        document.getElementById("msg").textContent = "Hãy bấm Lấy Key trước rồi mới gia hạn!";
        return;
      }
      if (renewInterval) return;

      let secLeft = 60;
      const btn = document.getElementById("renewBtn");
      btn.disabled = true;
      btn.textContent = `Đang đếm ngược gia hạn: ${secLeft}s...`;
      document.getElementById("msg").textContent = "Đang chờ 30 giây để gia hạn thêm 4 giờ...";

      renewInterval = setInterval(() => {
        secLeft--;
        if (secLeft > 0) {
          btn.textContent = `Đang đếm ngược gia hạn: ${secLeft}s...`;
        } else {
          clearInterval(renewInterval);
          renewInterval = null;
          btn.disabled = false;
          btn.textContent = "Gia Hạn (Đếm Ngược 30s)";

          const baseTime = Math.max(Date.now(), expireAtMs);
          currentCycleIdx = currentCycleIdx + 1;
          expireAtMs = baseTime + KEY_TTL_MS;
          hasTakenKey = true;

          const newKey = tinhKey(uid, currentCycleIdx);
          document.getElementById("cycleLabel").textContent = "#" + currentCycleIdx;
          document.getElementById("keyOut").textContent = newKey;
          document.getElementById("msg").textContent = "Gia hạn xong! Key mới đã được cộng thêm 4h.";
        }
      }, 1000);
    }

    function copyKey() {
      const k = document.getElementById("keyOut").textContent;
      if (!hasTakenKey || !k || k === "----------") {
        document.getElementById("msg").textContent = "Bấm Lấy Key trước đã!";
        return;
      }
      navigator.clipboard.writeText(k).then(() => {
        document.getElementById("msg").textContent = "Đã sao chép key!";
      }).catch(() => {
        document.getElementById("msg").textContent = "Giữ lì vào dãy số để sao chép.";
      });
    }

    document.getElementById("uidInput").addEventListener("input", () => {
      resetTrangThaiChuaLayKey();
      document.getElementById("msg").textContent = "Bấm Lấy Key để bắt đầu đếm thời gian.";
    });

    setInterval(() => {
      const el = document.getElementById("keyCountdown");
      if (!hasTakenKey || !expireAtMs) {
        el.textContent = "--:--:--";
        return;
      }
      const left = expireAtMs - Date.now();
      if (left > 0) {
        el.textContent = formatHMS(left);
      } else {
        el.textContent = "00:00:00";
        document.getElementById("msg").textContent = "Đã hết thời gian key! Bấm Lấy Key hoặc Gia Hạn.";
      }
    }, 1000);
  </script>
</body>
</html>
