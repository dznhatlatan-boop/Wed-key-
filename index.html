<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AK HUB // KEY SYSTEM</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b1120;
      color: #f8fafc;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 390px;
      background: #1a2232;
      border: 1px solid #2b364b;
      border-radius: 16px;
      padding: 24px 20px;
      text-align: center;
      box-shadow: 0 14px 35px rgba(0, 0, 0, 0.45);
    }

    h1 {
      margin: 0 0 6px;
      font-size: 20px;
      font-weight: 700;
      color: #38bdf8;
      letter-spacing: 0.5px;
    }

    p {
      margin: 0 0 16px;
      font-size: 12px;
      color: #cbd5e1;
      line-height: 1.4;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #0d1424;
      color: #f8fafc;
      font-size: 13px;
      margin-bottom: 12px;
      text-align: center;
      outline: none;
    }

    input:focus {
      border-color: #38bdf8;
    }

    .info-bar {
      background: #0d1424;
      border: 1px solid #263248;
      border-radius: 10px;
      padding: 11px 12px;
      font-size: 12px;
      color: #93c5fd;
      margin-bottom: 12px;
      line-height: 1.55;
    }

    .key-box {
      background: #0d1424;
      border: 1px dashed #475569;
      border-radius: 10px;
      padding: 15px 12px;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #4ade80;
      margin-bottom: 14px;
      word-break: break-all;
    }

    button {
      width: 100%;
      padding: 12px 14px;
      border: none;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 10px;
    }

    .btn-get {
      background: #2f6df6;
      color: #ffffff;
    }

    .btn-renew {
      background: #e08a00;
      color: #ffffff;
    }

    .btn-renew:disabled {
      background: #475569;
      color: #cbd5e1;
      cursor: not-allowed;
    }

    .btn-copy {
      background: #1ea853;
      color: #ffffff;
      margin-bottom: 6px;
    }

    .msg {
      font-size: 12px;
      color: #94a3b8;
      min-height: 18px;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>AK HUB // KEY SYSTEM</h1>
    <p>UserId Key • 5h Cycle • Starts on Get Key</p>

    <input id="uidInput" type="text" placeholder="Enter Roblox UserId (e.g. 123456789)" />

    <div class="info-bar">
      <div>Cycle: <strong id="cycleLabel">None</strong></div>
      <div>Time Left: <strong id="keyCountdown">--:--:--</strong></div>
    </div>

    <div id="keyOut" class="key-box">----------</div>

    <button class="btn-get" onclick="getKeyNow()">Get Key</button>
    <button id="renewBtn" class="btn-renew" onclick="renewKey30s()">Renew (30s)</button>
    <button class="btn-copy" onclick="copyKey()">Copy Key</button>

    <div id="msg" class="msg"></div>
  </div>

  <script>
    const SECRET_SALT = 7919;
    const KEY_TTL_MS = 5 * 60 * 60 * 1000;
    const CYCLE_BUCKET_MS = 5 * 60 * 60 * 1000;
    const RENEW_WAIT_SEC = 30;
    const OWNER_ACCOUNTS = ["hupbera23", "hupbera5"];

    let hasTakenKey = false;
    let isOwnerMode = false;
    let expireAtMs = 0;
    let currentCycleIdx = null;
    let renewInterval = null;

    function getRawInput() {
      return document.getElementById("uidInput").value.trim();
    }

    function getCleanUid() {
      return getRawInput().replace(/\D/g, "");
    }

    function isOwnerInput(raw) {
      return OWNER_ACCOUNTS.includes(String(raw || "").toLowerCase());
    }

    function getCycleFromTimestamp(ms) {
      return Math.floor(ms / CYCLE_BUCKET_MS);
    }

    function calcKey(uid, cycleIdx) {
      let hash = SECRET_SALT;
      const mix = `${uid}_${cycleIdx}`;
      for (let i = 0; i < mix.length; i++) {
        hash = (hash * 131 + mix.charCodeAt(i)) % 89999999;
      }
      return String(10000000 + hash);
    }

    function formatHMS(ms) {
      const totalSec = Math.max(0, Math.floor(ms / 1000));
      const h = String(Math.floor(totalSec / 3600)).padStart(2, "0");
      const m = String(Math.floor((totalSec % 3600) / 60)).padStart(2, "0");
      const s = String(totalSec % 60).padStart(2, "0");
      return `${h}:${m}:${s}`;
    }

    function resetKeyState() {
      hasTakenKey = false;
      isOwnerMode = false;
      expireAtMs = 0;
      currentCycleIdx = null;
      document.getElementById("cycleLabel").textContent = "None";
      document.getElementById("keyOut").textContent = "----------";
      document.getElementById("keyCountdown").textContent = "--:--:--";
    }

    function applyOwnerState(raw) {
      hasTakenKey = false;
      isOwnerMode = true;
      expireAtMs = 0;
      currentCycleIdx = "OWNER";
      document.getElementById("cycleLabel").textContent = "OWNER VN";
      document.getElementById("keyCountdown").textContent = "UNLIMITED";
      document.getElementById("keyOut").textContent = "OWNER-UNLIMITED";
      document.getElementById("msg").textContent = `OWNER VN (${raw}) - Unlimited access in-game.`;
    }

    function getKeyNow() {
      const raw = getRawInput();
      if (!raw) {
        document.getElementById("msg").textContent = "Enter Roblox UserId first.";
        return;
      }

      if (isOwnerInput(raw)) {
        applyOwnerState(raw);
        return;
      }

      const uid = getCleanUid();
      if (!uid) {
        document.getElementById("msg").textContent = "UserId must be numbers only (e.g. 123456789).";
        return;
      }

      isOwnerMode = false;
      const now = Date.now();
      currentCycleIdx = getCycleFromTimestamp(now);
      expireAtMs = now + KEY_TTL_MS;
      hasTakenKey = true;

      const key = calcKey(uid, currentCycleIdx);
      document.getElementById("cycleLabel").textContent = "#" + currentCycleIdx;
      document.getElementById("keyOut").textContent = key;
      document.getElementById("keyCountdown").textContent = formatHMS(expireAtMs - Date.now());
      document.getElementById("msg").textContent = "Key generated. Valid for 5 hours.";
    }

    function renewKey30s() {
      const raw = getRawInput();
      if (!raw) {
        document.getElementById("msg").textContent = "Enter UserId before renewing.";
        return;
      }

      if (isOwnerInput(raw) || isOwnerMode) {
        applyOwnerState(raw);
        return;
      }

      const uid = getCleanUid();
      if (!uid) {
        document.getElementById("msg").textContent = "Invalid UserId.";
        return;
      }

      if (!hasTakenKey || !expireAtMs) {
        document.getElementById("msg").textContent = "Click Get Key before renewing.";
        return;
      }

      if (renewInterval) return;

      let secLeft = RENEW_WAIT_SEC;
      const btn = document.getElementById("renewBtn");
      btn.disabled = true;
      btn.textContent = `Renewing: ${secLeft}s...`;
      document.getElementById("msg").textContent = `Waiting ${RENEW_WAIT_SEC}s to add 5 hours...`;

      renewInterval = setInterval(() => {
        secLeft--;
        if (secLeft > 0) {
          btn.textContent = `Renewing: ${secLeft}s...`;
        } else {
          clearInterval(renewInterval);
          renewInterval = null;
          btn.disabled = false;
          btn.textContent = `Renew (${RENEW_WAIT_SEC}s)`;

          const baseTime = Math.max(Date.now(), expireAtMs);
          currentCycleIdx = currentCycleIdx + 1;
          expireAtMs = baseTime + KEY_TTL_MS;
          hasTakenKey = true;

          const newKey = calcKey(uid, currentCycleIdx);
          document.getElementById("cycleLabel").textContent = "#" + currentCycleIdx;
          document.getElementById("keyOut").textContent = newKey;
          document.getElementById("msg").textContent = "Renewed! Added 5 hours.";
        }
      }, 1000);
    }

    function copyKey() {
      const k = document.getElementById("keyOut").textContent;
      if (!hasTakenKey || !k || k === "----------" || k === "OWNER-UNLIMITED") {
        document.getElementById("msg").textContent = "Get a UserId key first.";
        return;
      }

      navigator.clipboard.writeText(k).then(() => {
        document.getElementById("msg").textContent = "Key copied.";
      }).catch(() => {
        document.getElementById("msg").textContent = "Long-press the key to copy.";
      });
    }

    document.getElementById("uidInput").addEventListener("input", () => {
      const raw = getRawInput();
      if (isOwnerInput(raw)) {
        applyOwnerState(raw);
        return;
      }
      resetKeyState();
      document.getElementById("msg").textContent = "Click Get Key to start timer.";
    });

    setInterval(() => {
      const el = document.getElementById("keyCountdown");
      if (isOwnerMode) {
        el.textContent = "UNLIMITED";
        return;
      }
      if (!hasTakenKey || !expireAtMs) {
        el.textContent = "--:--:--";
        return;
      }
      const left = expireAtMs - Date.now();
      if (left > 0) {
        el.textContent = formatHMS(left);
      } else {
        el.textContent = "00:00:00";
        document.getElementById("msg").textContent = "Key expired. Click Get Key or Renew.";
      }
    }, 1000);
  </script>
</body>
</html>
