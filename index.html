<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TÂN HUB // GET KEY</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #090d16; color: #e6eef8; padding: 16px;
    }
    .card {
      width: 100%; max-width: 420px; background: #101726; border: 1px solid #1e3a5f;
      border-radius: 14px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.45);
    }
    .badge {
      display: inline-block; background: #0088ff; color: #fff; font-size: 11px;
      font-weight: bold; padding: 4px 10px; border-radius: 999px; margin-bottom: 10px;
    }
    h1 { margin: 0 0 6px; font-size: 20px; color: #38bdf8; }
    p { margin: 0 0 18px; font-size: 13px; color: #9fb3c8; line-height: 1.5; }
    .key-box {
      background: #090e1a; border: 1px dashed #38bdf8; border-radius: 10px;
      padding: 14px; text-align: center; font-size: 18px; font-weight: bold;
      letter-spacing: 1px; color: #34d399; margin-bottom: 14px; display: none;
    }
    button {
      width: 100%; padding: 12px; border: none; border-radius: 10px; font-size: 14px;
      font-weight: bold; cursor: pointer; transition: 0.2s; margin-bottom: 10px;
    }
    .btn-get { background: #0284c7; color: #fff; }
    .btn-get:hover { background: #0369a1; }
    .btn-copy { background: #10b981; color: #fff; display: none; }
    .btn-copy:hover { background: #059669; }
    .status { font-size: 12px; text-align: center; color: #94a3b8; min-height: 18px; }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">PREMIUM AUTH</span>
    <h1>TÂN HUB // KEY SYSTEM</h1>
    <p>Bấm nút bên dưới để nhận key, sau đó copy key và dán vào khung xác minh trong game.</p>

    <button class="btn-get" id="getBtn" onclick="startGetKey()">🔑 Lấy Key Ngay</button>
    <div class="key-box" id="keyBox">123</div>
    <button class="btn-copy" id="copyBtn" onclick="copyKey()">📋 Copy Key</button>

    <div class="status" id="status">Trạng thái: Sẵn sàng</div>
  </div>

  <script>
    const KEY_VALUE = "123"; // Trùng với _ValidKey trong script Roblox

    function startGetKey() {
      const getBtn = document.getElementById("getBtn");
      const status = document.getElementById("status");
      let sec = 5;
      getBtn.disabled = true;

      const timer = setInterval(() => {
        status.textContent = `Đang tạo key... vui lòng chờ ${sec}s`;
        sec--;
        if (sec < 0) {
          clearInterval(timer);
          getBtn.style.display = "none";
          document.getElementById("keyBox").textContent = KEY_VALUE;
          document.getElementById("keyBox").style.display = "block";
          document.getElementById("copyBtn").style.display = "block";
          status.textContent = "Đã tạo key thành công! Bấm Copy Key để sao chép.";
        }
      }, 1000);
    }

    function copyKey() {
      navigator.clipboard.writeText(KEY_VALUE).then(() => {
        document.getElementById("status").textContent = "✅ Đã copy key vào bộ nhớ tạm!";
      });
    }
  </script>
</body>
</html>
